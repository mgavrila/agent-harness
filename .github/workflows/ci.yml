# The four gates and the image builds, on every pull request and every push to main.
#
# The gates job is `pnpm -r typecheck`, `pnpm lint`, `pnpm arch`, `pnpm format:check` and
# `pnpm test`, exactly as CONTRIBUTING.md's "Before you push" lists them, against a Postgres
# service with the same three extra databases the Compose stack's init.sql creates. The image job
# builds both images the release workflow publishes, and pushes neither.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned to the same explicit pgvector version Compose runs, not the floating `pg16` tag:
        # knowledge search sets `hnsw.iterative_scan`, which pgvector added in 0.8.0, and a
        # floating tag that moved back below that floor would break search at query time.
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://harness:harness@localhost:15432/harness
      TEST_DATABASE_URL: postgres://harness:harness@localhost:15432/harness_test
      CONTROL_PLANE_TEST_DATABASE_URL: postgres://harness:harness@localhost:15432/harness_test
      EVALS_DATABASE_URL: postgres://harness:harness@localhost:15432/harness_evals
      # A gateway key the spawned core-tools servers refuse to start without; no model is
      # ever called in the suite.
      LITELLM_MASTER_KEY: sk-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      # No `version` input: the root package.json pins `packageManager: pnpm@11.4.0`, which is
      # what the action reads, and v4 refuses to be told the version twice.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the parsing binaries and psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Create the test and evals databases, with the init.sql Compose uses
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f harness/compose/postgres/init.sql
      - run: pnpm db:migrate
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm arch
      - run: pnpm format:check
      - run: pnpm test

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose pulls published images now, so there is nothing for it to build. These are the two
      # builds release.yml pushes on a tag; here they only prove the Dockerfiles still build, and
      # nothing is pushed or tagged for a registry.
      - name: Build the host image
        run: docker build -f harness/compose/node.Dockerfile -t agent-harness-host:ci .
      - name: Build the files worker image
        run: docker build -f harness/compose/files.Dockerfile -t agent-harness-files:ci .
