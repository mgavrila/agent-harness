name: agent-harness
networks:
  default:
    name: agent-harness_default
  files:
    internal: true
    name: agent-harness_files
services:
  core-tools:
    build:
      context: ../..
      dockerfile: harness/compose/core-tools.Dockerfile
    depends_on:
      litellm:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      HARNESS_CLIENT: ${HARNESS_CLIENT:-demo-practice}
      HARNESS_ENCRYPTION_KEY: ${HARNESS_ENCRYPTION_KEY:?set HARNESS_ENCRYPTION_KEY in .env}
      HARNESS_GATEWAY_URL: http://litellm:4000
      HARNESS_STORAGE_DIR: /data/storage
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
    networks:
      default: null
    profiles:
      - build-only
    volumes:
      - bind:
          create_host_path: true
        source: ../../storage
        target: /data/storage
        type: bind
  files:
    build:
      context: ../..
      dockerfile: harness/compose/files.Dockerfile
    environment:
      HARNESS_FILES_BIND: 0.0.0.0
      HARNESS_FILES_PORT: "8790"
      HARNESS_STORAGE_DIR: /srv/harness-storage
    healthcheck:
      interval: 10s
      retries: 6
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:8790/healthz'').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"'
      timeout: 5s
    image: harness-files
    networks:
      files: null
    profiles:
      - demo
    restart: unless-stopped
    volumes:
      - source: storage
        target: /srv/harness-storage
        type: volume
        volume: {}
  host:
    build:
      context: ../..
      dockerfile: harness/compose/node.Dockerfile
    depends_on:
      files:
        condition: service_healthy
        required: true
      litellm:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
    environment:
      APPROVALS_HEALTH_BIND: ${APPROVALS_HEALTH_BIND:-0.0.0.0}
      APPROVALS_HEALTH_PORT: "8787"
      APPROVALS_POLL_SECONDS: ${APPROVALS_POLL_SECONDS:-5}
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      EFFECTS_DISPATCH_SECONDS: ${EFFECTS_DISPATCH_SECONDS:-5}
      HARNESS_CLIENT: ${HARNESS_CLIENT:-demo-practice}
      HARNESS_ENCRYPTION_KEY: ${HARNESS_ENCRYPTION_KEY:-}
      HARNESS_FILES_URL: http://files:8790
      HARNESS_GATEWAY_URL: http://litellm:4000
      HARNESS_HISTORY_MAX_MESSAGES: ${HARNESS_HISTORY_MAX_MESSAGES:-40}
      HARNESS_HOST_PRINCIPAL: ${HARNESS_HOST_PRINCIPAL:-svc-host}
      HARNESS_IDENTITY: ${HARNESS_IDENTITY:-@harness/identity-static}
      HARNESS_PACKS: ${HARNESS_PACKS:-@harness/pack-healthcare}
      HARNESS_POLICY_FILE: /srv/agent-harness/clients/${HARNESS_CLIENT:?set HARNESS_CLIENT in .env}/policy.yaml
      HARNESS_RUN_MAX_MODEL_CALLS: ${HARNESS_RUN_MAX_MODEL_CALLS:-30}
      HARNESS_RUN_MAX_TOOL_CALLS: ${HARNESS_RUN_MAX_TOOL_CALLS:-60}
      HARNESS_RUN_TIMEOUT_S: ${HARNESS_RUN_TIMEOUT_S:-600}
      HARNESS_RUNTIME: ${HARNESS_RUNTIME:-@harness/runtime-deepagents}
      HARNESS_STORAGE_DIR: /srv/harness-storage
      HARNESS_SURFACES: ${HARNESS_SURFACES:-@harness/surface-slack}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      RECONCILE_SECONDS: ${RECONCILE_SECONDS:-300}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_APPROVALS_CHANNEL: ${SLACK_APPROVALS_CHANNEL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    image: harness-host
    networks:
      default: null
      files: null
    ports:
      - 127.0.0.1:${APPROVALS_HEALTH_HOST_PORT:-8787}:8787
    profiles:
      - demo
    restart: unless-stopped
    volumes:
      - source: storage
        target: /srv/harness-storage
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: ../../packs
        target: /srv/agent-harness/packs
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ../../clients
        target: /srv/agent-harness/clients
        type: bind
  litellm:
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/litellm
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-none}
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 30s
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else 1)"
      timeout: 5s
    image: ghcr.io/berriai/litellm:main-stable
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "4000"
        target: 4000
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ../gateway/litellm.config.yaml
        target: /app/config.yaml
        type: bind
  postgres:
    environment:
      POSTGRES_DB: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_USER: harness
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U harness -d harness
      timeout: 3s
    image: pgvector/pgvector:pg16
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "15432"
        target: 5432
    volumes:
      - source: pgdata
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: ./postgres/init.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        type: bind
volumes:
  pgdata:
    name: agent-harness_pgdata
  storage:
    name: agent-harness_storage
