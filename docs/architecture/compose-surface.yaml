name: agent-harness
networks:
  default:
    name: agent-harness_default
services:
  approvals:
    build:
      context: ../..
      dockerfile: harness/compose/node.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      APPROVALS_HEALTH_BIND: ${APPROVALS_HEALTH_BIND:-0.0.0.0}
      APPROVALS_HEALTH_PORT: "8787"
      APPROVALS_POLL_SECONDS: ${APPROVALS_POLL_SECONDS:-5}
      APPROVALS_SLACK_APP_TOKEN: ${APPROVALS_SLACK_APP_TOKEN:-}
      APPROVALS_SLACK_BOT_TOKEN: ${APPROVALS_SLACK_BOT_TOKEN:-}
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      EFFECTS_DISPATCH_SECONDS: ${EFFECTS_DISPATCH_SECONDS:-5}
      HARNESS_CLIENT: ${HARNESS_CLIENT:-demo-practice}
      HARNESS_ENCRYPTION_KEY: ${HARNESS_ENCRYPTION_KEY:-}
      HARNESS_FORMS_DIR: /srv/agent-harness/packs/healthcare/forms
      HARNESS_GATEWAY_URL: http://litellm:4000
      HARNESS_PACKS: ${HARNESS_PACKS:-@harness/pack-healthcare}
      HARNESS_POLICY_FILE: /srv/agent-harness/clients/demo-practice/policy.yaml
      HARNESS_STORAGE_DIR: /srv/harness-storage
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      RECONCILE_SECONDS: ${RECONCILE_SECONDS:-300}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-}
      SLACK_APPROVALS_CHANNEL: ${SLACK_APPROVALS_CHANNEL:-}
    image: harness-approvals
    networks:
      default: null
    ports:
      - 127.0.0.1:${APPROVALS_HEALTH_HOST_PORT:-8787}:8787
    profiles:
      - demo
    restart: unless-stopped
    volumes:
      - source: storage
        target: /srv/harness-storage
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: ../../packs
        target: /srv/agent-harness/packs
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ../../clients
        target: /srv/agent-harness/clients
        type: bind
  core-tools:
    build:
      context: ../..
      dockerfile: harness/compose/core-tools.Dockerfile
    depends_on:
      litellm:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      HARNESS_CLIENT: ${HARNESS_CLIENT:-demo-practice}
      HARNESS_ENCRYPTION_KEY: ${HARNESS_ENCRYPTION_KEY:?set HARNESS_ENCRYPTION_KEY in .env}
      HARNESS_GATEWAY_URL: http://litellm:4000
      HARNESS_STORAGE_DIR: /data/storage
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
    networks:
      default: null
    profiles:
      - build-only
    volumes:
      - bind:
          create_host_path: true
        source: ../../storage
        target: /data/storage
        type: bind
  hermes:
    build:
      context: ../..
      dockerfile: harness/compose/hermes.Dockerfile
    command:
      - gateway
      - run
    depends_on:
      hermes-init:
        condition: service_completed_successfully
        required: true
      litellm:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
    env_file:
      - path: ../../.env
        required: true
    environment:
      APPROVALS_SLACK_APP_TOKEN: ""
      APPROVALS_SLACK_BOT_TOKEN: ""
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      HARNESS_FORMS_DIR: /srv/agent-harness/packs/healthcare/forms
      HARNESS_GATEWAY_URL: http://litellm:4000
      HARNESS_PACKS: ${HARNESS_PACKS:-@harness/pack-healthcare}
      HARNESS_POLICY_FILE: /srv/agent-harness/clients/demo-practice/policy.yaml
      HARNESS_STORAGE_DIR: /srv/harness-storage
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_UID: ${HERMES_UID:-1000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
    image: harness-hermes
    networks:
      default: null
    profiles:
      - demo
    restart: unless-stopped
    volumes:
      - source: hermesdata
        target: /opt/data
        type: volume
        volume: {}
      - source: storage
        target: /srv/harness-storage
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: ../../packs
        target: /srv/agent-harness/packs
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ../../clients
        target: /srv/agent-harness/clients
        type: bind
      - bind:
          create_host_path: true
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind
  hermes-init:
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /data/cron /data/scripts
        cp /srv/client/SOUL.md /data/SOUL.md
        cp /srv/client/hermes.config.yaml /data/config.yaml
        cp /srv/client/cron/playbooks.sh /data/cron/playbooks.sh
        cp /srv/client/scripts/*.sh /data/scripts/
        chmod +x /data/cron/playbooks.sh /data/scripts/*.sh
        # Hermes reads secrets from $$HERMES_HOME/.env; the process environment
        # carries them too, and whichever it prefers, both agree. The
        # approver's Slack app tokens are filtered out here for the same
        # reason the hermes service blanks them: they belong to a different
        # Slack app, and only the approvals container should hold them.
        # sed, not `grep -v`: grep exits 1 when it prints nothing, which
        # would abort this script under `set -e`.
        sed '/^APPROVALS_SLACK_/d' /srv/env/.env > /data/.env
        chmod 600 /data/.env
        # jobs.json is deliberately NOT seeded: its record shape is not
        # documented, and Hermes creates it on the first `hermes cron create`.
        # $$-escaped: these must reach the container's own shell unexpanded,
        # not be interpolated by Compose itself when it parses this file (that
        # would use the host/.env value instead of this service's own
        # environment: block below, and blank out to "chown -R \":\"" when
        # HERMES_UID/HERMES_GID are not set on the host).
        chown -R "$${HERMES_UID}:$${HERMES_GID}" /data
        # The shared store, same $$-escaping rule. `out/` is created here
        # rather than left to the first forms_fill, because that mkdir runs as
        # HERMES_UID inside the hermes container and the fresh volume root is
        # owned by root. The approvals container reads this tree as its own
        # uid-1000 `node` user, which matches the default HERMES_UID.
        mkdir -p /srv/harness-storage/out
        chown -R "$${HERMES_UID}:$${HERMES_GID}" /srv/harness-storage
        echo "hermes-init: seeded SOUL.md, config.yaml, cron/playbooks.sh, scripts/ and the storage root"
    environment:
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_UID: ${HERMES_UID:-1000}
    image: busybox:1.37
    networks:
      default: null
    profiles:
      - demo
    user: "0:0"
    volumes:
      - source: hermesdata
        target: /data
        type: volume
        volume: {}
      - source: storage
        target: /srv/harness-storage
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: ../../clients/demo-practice
        target: /srv/client
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ../../.env
        target: /srv/env/.env
        type: bind
  litellm:
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/litellm
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-none}
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 30s
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else 1)"
      timeout: 5s
    image: ghcr.io/berriai/litellm:main-stable
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "4000"
        target: 4000
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ../gateway/litellm.config.yaml
        target: /app/config.yaml
        type: bind
  postgres:
    environment:
      POSTGRES_DB: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_USER: harness
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U harness -d harness
      timeout: 3s
    image: postgres:16
    networks:
      default: null
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "15432"
        target: 5432
    volumes:
      - source: pgdata
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: ./postgres/init.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        type: bind
volumes:
  hermesdata:
    name: agent-harness_hermesdata
  pgdata:
    name: agent-harness_pgdata
  storage:
    name: agent-harness_storage
