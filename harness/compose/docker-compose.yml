# The harness stack.
#
# `postgres` and `litellm` have no profile, so they start with a bare
# `docker compose up`: the database and the model gateway are what everything
# else needs. `files` and `host` are the `demo` profile, and `pnpm demo:up`
# brings up the whole client instance. `core-tools` is build-only: nothing
# starts it as a service — it is hosted in-process inside `host`, and this
# entry only proves the image still builds, for the MCP inspector and the eval
# runner on an operator's machine. Every client path is derived from
# `HARNESS_CLIENT`; onboarding a client is a folder and a `.env`, never an edit
# here. No service mounts the Docker socket.
#
# Every variable below is interpolated from the repository-root `.env`, so run
# these through the `pnpm` scripts, which pass `--env-file .env`. Compose's own
# default is `.env` beside this file, where there is none.
# The project name is fixed here so containers, networks and volumes do not
# take their name from the checkout directory (two checkouts would otherwise
# share one Postgres). Override per instance with COMPOSE_PROJECT_NAME or -p.
name: agent-harness

services:
  postgres:
    # Postgres 16 with pgvector (spec section 7): migration 0013 declares `embedding vector(1024)`
    # and `runMigrations` installs the extension before migrating, which a plain postgres:16
    # cannot answer. Same major version, same data directory layout, so an existing pgdata volume
    # is reused as it is — see "Upgrading from Plan 9" in docs/runbook.md.
    # Pinned to an explicit pgvector version, not the floating `pg16` tag: knowledge search sets
    # `hnsw.iterative_scan`, which pgvector added in 0.8.0, and a floating tag that moved back
    # below that floor would break search at query time rather than at startup.
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U harness -d harness']
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      postgres:
        condition: service_healthy
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      DATABASE_URL: postgres://harness:harness@postgres:5432/litellm
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-none}
    volumes:
      - ../gateway/litellm.config.yaml:/app/config.yaml:ro
    ports:
      # Loopback only. The gateway holds every provider key; nothing outside
      # this host may reach it.
      - '127.0.0.1:4000:4000'
    healthcheck:
      # /health/liveliness is the unauthenticated probe. /health needs a key.
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:4000/health/liveliness'').status==200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Untrusted document parsing, in a process that holds no key and no database URL and cannot
  # reach the network. core-tools sends it a path under the storage root and gets pages back;
  # see harness/files/README.md. No env_file: its whole environment is the three lines below.
  files:
    build:
      context: ../..
      dockerfile: harness/compose/files.Dockerfile
    image: harness-files
    profiles: ['demo']
    restart: unless-stopped
    networks:
      - files
    environment:
      HARNESS_STORAGE_DIR: '/srv/harness-storage'
      HARNESS_FILES_PORT: '8790'
      # Every interface inside the container: the internal network is the boundary, and a
      # container-loopback listener would answer neither of the services that call it.
      HARNESS_FILES_BIND: '0.0.0.0'
    volumes:
      - storage:/srv/harness-storage
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8790/healthz'').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  # Built, not started: core-tools is hosted in-process inside `host` (see node.Dockerfile).
  # `docker compose build core-tools` proves the image still builds, for the MCP inspector and
  # the eval runner on an operator's machine.
  core-tools:
    build:
      context: ../..
      dockerfile: harness/compose/core-tools.Dockerfile
    profiles: ['build-only']
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      HARNESS_GATEWAY_URL: http://litellm:4000
      HARNESS_STORAGE_DIR: /data/storage
      HARNESS_ENCRYPTION_KEY: ${HARNESS_ENCRYPTION_KEY:?set HARNESS_ENCRYPTION_KEY in .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
    volumes:
      - ../../storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy

  # The one long-running harness process per client: the runtime, the surfaces and the identity
  # plug-in it loads by name, the approvals loops, and core-tools hosted in-process. The one
  # Slack app serves both chat and approvals.
  host:
    build:
      context: ../..
      dockerfile: harness/compose/node.Dockerfile
    image: harness-host
    profiles: ['demo']
    restart: unless-stopped
    networks:
      - default
      - files
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      files:
        condition: service_healthy
    # No env_file here, deliberately: an explicit allowlist interpolated from ../../.env.
    # Anything main.ts reads is listed here.
    environment:
      DATABASE_URL: 'postgres://harness:harness@postgres:5432/harness'
      HARNESS_ENCRYPTION_KEY: '${HARNESS_ENCRYPTION_KEY:-}'
      HARNESS_CLIENT: '${HARNESS_CLIENT:-demo-practice}'
      HARNESS_STORAGE_DIR: '/srv/harness-storage'
      # The run API surface is loaded beside the primary one so a headless caller has a surface
      # to name. It is never first: the first entry is where approval cards are posted, and this
      # one cannot post a card.
      HARNESS_SURFACES: '${HARNESS_SURFACES:-@harness/surface-slack,@harness/surface-http}'
      HARNESS_RUNTIME: '${HARNESS_RUNTIME:-@harness/runtime-deepagents}'
      HARNESS_HOST_PRINCIPAL: '${HARNESS_HOST_PRINCIPAL:-svc-host}'
      # This process refuses to start without a gateway key, reached on the compose network
      # rather than the host loopback the .env value names.
      HARNESS_GATEWAY_URL: 'http://litellm:4000'
      # Same worker, same network: documents are parsed there, not in this process.
      HARNESS_FILES_URL: 'http://files:8790'
      LITELLM_MASTER_KEY: '${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}'
      HARNESS_RUN_MAX_MODEL_CALLS: '${HARNESS_RUN_MAX_MODEL_CALLS:-30}'
      HARNESS_RUN_MAX_TOOL_CALLS: '${HARNESS_RUN_MAX_TOOL_CALLS:-60}'
      HARNESS_RUN_TIMEOUT_S: '${HARNESS_RUN_TIMEOUT_S:-600}'
      HARNESS_HISTORY_MAX_MESSAGES: '${HARNESS_HISTORY_MAX_MESSAGES:-40}'
      # The run API (spec 5.8). Unset HARNESS_HOST_TOKEN means no listener at all.
      HARNESS_HOST_TOKEN: '${HARNESS_HOST_TOKEN:-}'
      # Every interface inside the container, for the reason APPROVALS_HEALTH_BIND is: a
      # container-loopback listener answers neither the published port nor another container.
      HARNESS_HOST_BIND: '${HARNESS_HOST_BIND:-0.0.0.0}'
      HARNESS_HOST_PORT: '8788'
      # The width knowledge_chunks.embedding was created at. Changing it means a new database.
      HARNESS_EMBED_DIMS: '${HARNESS_EMBED_DIMS:-1024}'
      # The one Slack app: chat and approvals.
      SLACK_BOT_TOKEN: '${SLACK_BOT_TOKEN:-}'
      SLACK_APP_TOKEN: '${SLACK_APP_TOKEN:-}'
      SLACK_APPROVALS_CHANNEL: '${SLACK_APPROVALS_CHANNEL:-}'
      APPROVALS_POLL_SECONDS: '${APPROVALS_POLL_SECONDS:-5}'
      EFFECTS_DISPATCH_SECONDS: '${EFFECTS_DISPATCH_SECONDS:-5}'
      RECONCILE_SECONDS: '${RECONCILE_SECONDS:-300}'
      APPROVALS_HEALTH_PORT: '8787'
      APPROVALS_HEALTH_BIND: '${APPROVALS_HEALTH_BIND:-0.0.0.0}'
    ports:
      - '127.0.0.1:${APPROVALS_HEALTH_HOST_PORT:-8787}:8787'
      - '127.0.0.1:${HARNESS_HOST_PUBLISHED_PORT:-8788}:8788'
    volumes:
      - storage:/srv/harness-storage
      - ../../packs:/srv/agent-harness/packs:ro
      - ../../clients:/srv/agent-harness/clients:ro

networks:
  # The files worker's network. `internal: true` means no route out of it: the worker reaches
  # nothing — not the gateway, not the database, not the internet — and only the services
  # listed on it reach the worker (spec decision 3, invariant 6).
  files:
    internal: true

volumes:
  pgdata: {}
  storage: {}
