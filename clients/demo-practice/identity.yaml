# Who may act through this deployment, and as what. Read by @harness/identity-static — the
# plug-in HARNESS_IDENTITY names — from this folder. A principal's id is what every audit row,
# approval and run carries, so an id is stable and is never reused for someone else.
#
#   kind   user | service
#   level  member < practitioner < lead < admin for a person; service for a scheduled job's
#          or a process's own identity. A service is never "at least" a user level.
#
# Replace the two Slack member ids with the real ones before the first run; see the runbook's
# onboarding section for how to read a member id.
#
# `defaults:` is optional and this client does not use it: a surface named there
# (`defaults: { slack: member }`) admits anyone the file does not list, at that level, under
# `u-<surface>-<their user id>-<digest>` — derived from their surface user id, so their audit trail
# is their own across restarts. A user level only — never `service` — and never for `http`, whose
# one bearer token is shared by every caller of the run API. A surface with no default refuses an
# unknown user, which is what every principal below relies on; so does a surface misspelled here,
# silently, since a default for a surface that is not loaded simply never applies.
#
# An `http:` entry is the id that principal is named by over the run API (docs/runbook.md, "The
# run API"): any stable string, because the API resolves it here exactly as it resolves a Slack
# member id. A principal with no `http:` entry cannot drive a run over the API, which is the
# right default.
principals:
  - id: u-practice-manager
    kind: user
    level: admin
    displayName: Practice manager
    surfaces:
      slack: U0123ABCD
      http: practice-manager
  - id: u-coordinator
    kind: user
    level: lead
    displayName: Credentialing coordinator
    surfaces:
      slack: U0456EFGH
      http: coordinator
  # The host's own identity (HARNESS_HOST_PRINCIPAL): reconciliation runs as it.
  - id: svc-host
    kind: service
    level: service
    displayName: Harness host
  # The identity the scheduled playbooks in playbooks.yaml run as (spec 3.3).
  - id: svc-playbooks
    kind: service
    level: service
    displayName: Nightly playbooks
  # The stdio server's default: the MCP inspector and the eval runner on an operator's machine.
  - id: svc-local
    kind: service
    level: service
    displayName: Local operator
